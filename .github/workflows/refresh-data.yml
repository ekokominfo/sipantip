name: Refresh shared environmental data
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shared-environmental-data
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          ref: data-cache
          path: cache-store
      - name: Collect due sources and preserve last valid data
        run: node scripts/refresh-data.cjs --output cache-store/cache ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Publish data snapshot
        working-directory: cache-store
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cache
          if ! git diff --cached --quiet; then
            git commit -m 'Update shared environmental data'
            git push origin HEAD:data-cache
          fi
      - name: Report failed hotspot collection after preserving the cache
        run: |
          node - <<'NODE'
          const m=require('./cache-store/cache/manifest.json');
          const failed=['High','Medium','Low'].filter(level=>m.resources['hotspot-'+level]?.error);
          if(failed.length){console.error('::error::Hotspot collection failed: '+failed.join(', ')+'. Last valid data was preserved.');process.exitCode=1;}
          NODE
